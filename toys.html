<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Toys | Petals & Presents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Luckiest+Guy|Montserrat:400,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <style>
      /* Styles here are the same as the ones shared previously */
      body {
        font-family: "Montserrat", Arial, sans-serif;
        margin: 0;
        background: #f9fafd;
        color: #222;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 32px;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .logo {
        font-family: "Luckiest Guy", cursive;
        font-size: 1.7em;
        color: #222;
        margin-right: 18px;
      }
      .search-bar {
        flex: 1;
        display: flex;
        align-items: center;
        margin: 0 18px;
      }
      .search-bar input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 3px 0 0 3px;
        font-size: 1em;
      }
      .search-bar button {
        background: #00bcd4;
        border: none;
        color: #fff;
        padding: 9px 18px;
        border-radius: 0 3px 3px 0;
        cursor: pointer;
        font-size: 1em;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .topbar-hotline {
        font-size: 0.98em;
      }
      .topbar-icons i {
        font-size: 1.25em;
        margin: 0 8px;
        cursor: pointer;
      }
      .navbar {
        background: #b2ebf2;
        display: flex;
        align-items: center;
        padding: 0 32px;
        border-bottom: 1px solid #e0e0e0;
        overflow-x: auto;
      }
      .navbar a,
      .navbar span {
        font-weight: 700;
        color: #222;
        text-decoration: none;
        padding: 18px 18px;
        font-size: 1.1em;
        transition: background 0.2s;
        white-space: nowrap;
      }
      .navbar a:hover,
      .navbar span:hover {
        background: #e1f5fe;
        color: #e91e63;
      }
      footer {
        background: #b2ebf2;
        padding: 32px 0;
        color: #222;
      }
      .footer-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 24px;
        padding: 0 32px;
      }
      .footer-col {
        flex: 1 1 180px;
      }
      .footer-col h4 {
        font-size: 1.1em;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .footer-col ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .footer-col ul li {
        margin-bottom: 6px;
        font-size: 0.98em;
      }

      .toys-container {
        padding: 42px 32px;
        text-align: center;
      }
      .toys-container h1 {
        font-family: "Luckiest Guy", cursive;
        font-size: 2.4em;
        margin-bottom: 20px;
      }
      .toy-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
        margin-top: 32px;
      }
      .toy-item {
        background: #fff;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
        max-width: 200px;
        text-align: center;
      }
      .toy-item img {
        max-width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .toy-item h4 {
        margin: 0;
        font-size: 1.1em;
        font-weight: 700;
        color: #333;
      }

      @media (max-width: 600px) {
        .navbar,
        .topbar,
        .footer-row {
          padding: 0 10px;
        }
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9fafd;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 40px;
        font-size: 2.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .toy-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .toy-card {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        width: 260px;
        padding: 25px 20px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid #e0e0e0;
      }

      .toy-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      }

      .toy-id {
        font-size: 14px;
        color: #999;
        margin-bottom: 6px;
      }

      .toy-name {
        font-size: 20px;
        font-weight: 600;
        color: #34495e;
        margin-bottom: 12px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 6px;
      }

      .toy-stock {
        font-size: 16px;
        color: #27ae60;
      }

      .message {
        text-align: center;
        font-size: 18px;
        color: #777;
        margin-top: 40px;
      }

      a {
        display: flex;
        justify-content: center;
        margin-top: 50px;
        text-decoration: none;
      }

      button {
        background-color: #2980b9;
        color: #fff;
        padding: 12px 24px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #1c5980;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo">
        <a href="index.html"
          ><i class="fa-solid fa-spa"></i> Petals & Presents</a
        >
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Search for anything..." />
        <button><i class="fa fa-search"></i></button>
      </div>
      <div class="topbar-right">
        <div class="topbar-hotline">
          <b>Hotline</b><br />
          011 2564934
        </div>
        <div class="topbar-icons">
          <i class="fa fa-user"></i>
          <i class="fa fa-shopping-cart"></i>
        </div>
      </div>
    </div>
    <nav class="navbar">
      <span class="dropdown">Categories &#x25BC;</span>
      <a href="#">Our Collection</a>
      <a href="#">New Arrivals</a>
      <a href="#">Flowers</a>
      <a href="#">Chocolates</a>
      <a href="#">Cakes</a>
      <a href="#">Gift Sets</a>
      <a href="#">Deals</a>
      <a href="#">Order Status</a>
    </nav>

    <h1>Available Toys</h1>
    <div class="toy-container" id="toyContainer">
      <div class="message">Loading toys...</div>
    </div>
    <footer>
      <div class="footer-row">
        <div class="footer-col">
          <h4>About Us</h4>
          <ul>
            <li>Our Story</li>
            <li>Careers</li>
            <li>Privacy Policy</li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Help</h4>
          <ul>
            <li>FAQs</li>
            <li>Shipping</li>
            <li>Returns</li>
          </ul>
        </div>
      </div>
    </footer>
    <script>
      fetch("http://localhost:8080/api/toys/getToys")
        .then((response) => response.json())
        .then((data) => {
          const container = document.getElementById("toyContainer");
          container.innerHTML = "";

          if (data.length === 0) {
            container.innerHTML =
              '<div class="message">No toys available.</div>';
          } else {
            data.forEach((toy) => {
              const card = document.createElement("div");
              card.className = "toy-card";
              card.innerHTML = `
              <div class="toy-id">Toy ID: ${toy.toyid}</div>
              <div class="toy-name">${toy.toyname}</div>
              <div class="toy-stock">Available Stock: ${toy.available_stock}</div>
            `;
              container.appendChild(card);
            });
          }
        })
        .catch((err) => {
          console.error(err);
          document.getElementById("toyContainer").innerHTML =
            '<div class="message">Failed to load toys. Please try again later.</div>';
        });
    </script>
  </body>
</html>
